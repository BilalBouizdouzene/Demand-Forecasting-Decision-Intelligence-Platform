[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "demand-forecasting-decision-intelligence"
version = "0.1.0"
description = "Leakage-safe retail demand forecasting and inventory decision support on the M5 dataset."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Demand Intelligence Team"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pyarrow>=14,<22",
  "PyYAML>=6.0,<7",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
  "joblib>=1.3,<2",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "pydantic>=2.6,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
ml = ["xgboost>=2.0,<4", "lightgbm>=4.3,<5", "shap>=0.45,<1"]
tracking = ["mlflow>=2.10,<4"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.5,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["src/demand_intelligence"]
